<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GK Story Builder</title>
<style>
:root{--bg:#1e1e1e;--p1:#252526;--p2:#2d2d30;--bd:#3c3c3c;--tx:#d4d4d4;--mu:#858585;--ac:#4fc1ff;--ok:#6a9955;--dn:#f48771}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:3px;padding:4px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#111;border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#top{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--p1);border-bottom:1px solid var(--bd);flex-wrap:wrap}
#top b{color:var(--ac);font-family:Consolas,monospace;margin-right:4px}#pname{width:190px}.sp{flex:1}
#main{flex:1;display:grid;grid-template-columns:230px 1fr 250px;min-height:0}
aside{background:var(--p1);overflow:auto;padding:10px}#L{border-right:1px solid var(--bd)}#R{border-left:1px solid var(--bd)}
h4{margin:0 0 8px;color:var(--mu);font-weight:600}
.pg{display:flex;align-items:center;gap:4px;padding:5px 7px;border-radius:3px;cursor:pointer}.pg:hover{background:var(--p2)}.pg.sel{background:#094771}
.pg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pg small{color:var(--mu)}
.pa{display:none;gap:2px;flex-wrap:wrap;padding:2px 7px 8px}.pg.sel+.pa{display:flex}.pa button{padding:1px 6px;font-size:12px}
#C{overflow:auto;padding:18px;background:#181818;display:flex;justify-content:center}
#doc{width:100%;max-width:780px;background:var(--p1);border:1px solid var(--bd);border-radius:4px;padding:26px 34px;align-self:flex-start;min-height:60%}
.blk{position:relative;padding:6px 8px;margin:2px -8px;border:1px dashed transparent;border-radius:3px}.blk:hover{border-color:var(--bd)}.blk.sel{border-color:var(--ac)}
.bt{position:absolute;right:4px;top:-13px;display:none;gap:2px;background:var(--p2);border:1px solid var(--bd);border-radius:3px;padding:1px}.blk.sel .bt{display:flex}.bt button{padding:0 6px;border:0;background:none}
.ed{outline:none;min-height:1.2em}.ed:empty:before{content:attr(data-ph);color:var(--mu)}
.blk h1,.blk h2,.blk h3,.blk p,.blk blockquote,.blk ul,.blk ol{margin:0}.blk h1{font-size:2.1em}.blk h2{font-size:1.6em}.blk h3{font-size:1.25em}
.blk blockquote{border-left:3px solid var(--ac);padding-left:14px;font-style:italic;font-size:1.1em}.blk img{max-width:100%;border-radius:4px}
.imgph{border:1px dashed var(--bd);padding:26px;text-align:center;color:var(--mu)}
.add{display:flex;gap:5px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--bd)}
.pr label{display:block;margin:10px 0 3px;color:var(--mu)}.pr input,.pr select,.pr textarea{width:100%}
#pv{display:none;flex:1;justify-content:center;background:#111;overflow:auto;padding:12px}#pv iframe{border:0;background:#fff;height:100%;border-radius:4px}
.hint{color:var(--mu);margin:10px 0 0;font-size:12px}#msg{color:var(--ok);margin-left:6px}
dialog{background:var(--p1);color:var(--tx);border:1px solid var(--bd);border-radius:6px}dialog::backdrop{background:#0009}
.ed[data-b]{display:block;width:fit-content;padding:7px 18px;border-radius:5px;background:var(--ac);color:#111;font-weight:600}.ed[data-b=outline]{background:none;color:var(--ac);border:2px solid var(--ac)}.ed[data-al=center]{margin-inline:auto}.ed[data-al=right]{margin-left:auto}
.copt .cq{margin:0 0 8px;font-weight:600}.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.opts .o{display:inline-flex;align-items:center;gap:6px}.opts .ob{background:var(--ac);color:#111;padding:6px 16px;border-radius:5px;font-weight:600;min-width:3em}.opts small{color:var(--mu)}
.gthumbs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.gthumbs img{height:90px;border-radius:4px}.row{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center}
.ib{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.ib.top{flex-direction:column;align-items:stretch}.ib.right{flex-direction:row-reverse}.ib .ibi,.ib .ibt{flex:1 1 200px}.ib img{width:100%;border-radius:4px;display:block}.ib p{margin:0 0 6px}
.split{display:grid;gap:14px}.split.sh{grid-auto-flow:column;grid-auto-columns:1fr}.split.sv{grid-template-columns:1fr}.split.sg{grid-template-columns:repeat(2,1fr)}.split img{width:100%;border-radius:4px;display:block}.sc .ed{white-space:pre-wrap}
mark{background:#ffe066;color:#111;padding:0 2px;border-radius:2px}.cd{font:13px/1.5 Consolas,monospace;background:#1b1b1b;padding:10px 12px;border-radius:4px;white-space:pre;overflow:auto;margin:0}
.etb{border-collapse:collapse;width:100%}.etb td,.etb th{border:1px solid var(--bd);padding:5px 8px;min-width:60px}.etb th{background:var(--p2)}
.dh{position:absolute;left:-18px;top:6px;cursor:grab;color:var(--mu);opacity:0;user-select:none}.blk:hover .dh,.blk.sel .dh{opacity:1}.dov{box-shadow:0 -2px 0 var(--ac)}.dob{box-shadow:0 2px 0 var(--ac)}
.blk[data-cond]::before{content:attr(data-cond);position:absolute;left:4px;top:-12px;font-size:11px;background:#8bc34a;color:#111;padding:0 5px;border-radius:3px;z-index:1}
.ol{cursor:pointer;padding:2px 4px;border-radius:3px}.ol:hover{background:var(--p2)}.lb{display:flex;align-items:center;gap:4px;padding:3px 4px}.lb span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb button{padding:1px 6px;font-size:12px}#mapdlg{width:min(960px,96vw)}.mn:hover rect{fill:#094771}
@media(max-width:900px){#main{grid-template-columns:1fr}aside{max-height:30vh}}
</style></head><body>
<div id="top">
 <b>GK Story Builder</b><input id="pname" aria-label="Project name">
 <button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button>
 <span class="sp"></span>
 <button data-dev="100%" class="dv on">Desktop</button><button data-dev="768px" class="dv">Tablet</button><button data-dev="390px" class="dv">Mobile</button>
 <button id="mapb">Story map</button><button id="prev">Preview</button>
 <select id="theme" aria-label="Site theme"><option value="dark">Site: Dark</option><option value="light">Site: Light</option><option value="sepia">Site: Sepia</option></select>
 <button id="save">Save</button><button id="imp">Import</button><button id="expj">Export JSON</button><button id="exph">Export HTML</button><button id="expz" class="on">Export website (ZIP)</button><span id="msg"></span>
</div>
<div id="rtb" style="display:none;gap:6px;align-items:center;padding:4px 10px;background:var(--p2);border-bottom:1px solid var(--bd)"><button data-r="bold" title="Bold"><b>B</b></button><button data-r="italic" title="Italic"><i>I</i></button><button data-r="underline" title="Underline"><u>U</u></button><button data-r="hl">Highlight</button><button data-r="link">Link</button><button data-r="unlink">Unlink</button><button data-r="removeFormat">Clear</button><span class="hint" style="margin:0">Formatting works in paragraphs and quotes.</span></div>
<div id="main">
 <aside id="L"><h4>PAGES</h4><div id="pages"></div><button id="newp" style="width:100%;margin-top:8px">+ New page</button>
 <h4 style="margin-top:20px">REUSABLE BLOCKS</h4><div id="lib"></div><div class="row"><button id="libsel">Save selected block</button><button id="libpg">Save whole page</button></div></aside>
 <div id="C"><div id="doc"></div></div>
 <div id="pv"><iframe id="fr" title="Preview"></iframe></div>
 <aside id="R" class="pr"><h4>PROPERTIES</h4><div id="props"><p class="hint">Select a block to edit its settings.</p></div><h4 style="margin-top:22px">OUTLINE</h4><div id="outline"></div></aside>
</div>
<dialog id="mapdlg"><div style="display:flex;justify-content:space-between;align-items:center"><h4 style="margin:0">Story map</h4><button id="mapx">Close</button></div><div id="mapbody" style="overflow:auto;max-height:72vh;margin-top:10px"></div></dialog>
<input type="file" id="fimg" accept="image/*,.gif" hidden><input type="file" id="fgal" accept="image/*,.gif" multiple hidden><input type="file" id="fjson" accept=".json,.html,.htm" hidden><input type="file" id="fany" hidden>
<dialog id="dlg"><form method="dialog"><h4>New page</h4>
 <label>Name<br><input id="dn" value="New page"></label><br><br>
 <label>Template<br><select id="dt"><option value="blank">Blank</option><option value="story">Story</option><option value="blog">Blog</option><option value="branch">Branching story (choices + variables)</option><option value="showcase">Content showcase (rich text, code, table, media)</option></select></label><br><br>
 <button value="ok">Create page</button> <button value="x">Cancel</button></form></dialog>
<script>
"use strict";
const $=s=>document.querySelector(s),uid=p=>p+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"page";
let P,cur,sel=null,hist=[],fut=[],dev="100%",pv=false,imgTarget=null;

/* ---------- state ---------- */
const mkBlock=t=>({id:uid("b_"),t,text:t==="heading"?"New heading":t==="button"?"Read more":t==="choice"?"What does she hate?":t==="imgbtn"?"Learn more":t==="code"?"// your code here":"",bstyle:"solid",html:"",setk:"",setv:"",ifk:"",ifv:"",ifop:"is",hdr:true,tbl:t==="table"?[["Name","Role"],["Mira","Explorer"],["Leo","Guide"]]:[],dir:"h",auto:false,delay:3,zoom:false,layout:"top",cells:t==="split"?[{k:"text",text:"First panel",asset:null,alt:""},{k:"image",text:"",asset:null,alt:""}]:[],imgs:[],opts:t==="choice"?[{label:"She hates banana",to:""},{label:"She hates apple",to:""}]:[],lvl:2,align:"left",size:100,asset:null,alt:"",cap:"",items:["First item"],href:"#"});
function tplAdv(kind){
 const H=(t,l)=>{const b=mkBlock("heading");b.text=t;b.lvl=l||2;return b},
 Pp=(t,html)=>{const b=mkBlock("paragraph");b.text=t;if(html)b.html=html;return b},
 Bt=(t,to,st,k,v)=>{const b=mkBlock("button");b.text=t;b.href=to?"@"+to:"#";b.bstyle=st||"solid";if(k){b.setk=k;b.setv=v||""}return b},
 If=(b,k,v)=>{b.ifk=k;b.ifv=v;b.ifop="is";return b};
 if(kind==="showcase"){
  const code=mkBlock("code");code.text="function greet(name){\n  return \"Hello, \"+name;\n}";
  return[H("Content showcase",1),Pp("This paragraph has bold, italic, underline, highlight and a link.","This paragraph has <b>bold</b>, <i>italic</i>, <u>underline</u>, <mark>highlight</mark> and a <a href=\"@"+P.home+"\">link to the home page</a>."),H("Code",2),code,H("Table",2),mkBlock("table"),H("Video and audio",2),mkBlock("video"),mkBlock("audio"),mkBlock("divider"),Pp("Tip: select any block, then use Save selected block in the left panel to reuse it on other pages. Drag the handle on the left of a block to reorder it.")]}
 const iB=uid("p_"),iA=uid("p_"),iE=uid("p_"),ch=mkBlock("choice");
 ch.opts=[{label:"She hates banana",to:iB,setk:"hates",setv:"banana"},{label:"She hates apple",to:iA,setk:"hates",setv:"apple"}];
 const pg=(id,t,bl)=>({id,title:t,slug:slugify(t)+"-"+id.slice(-4),nav:false,blocks:bl});
 queueMicrotask(()=>{P.pages.push(
  pg(iB,"She hates banana",[H("The banana stand",1),Pp("The vendor holds up a bunch of bananas. Mira turns away at once."),Bt("Walk on",iE)]),
  pg(iA,"She hates apple",[H("The apple cart",1),Pp("A pyramid of red apples. Mira crosses the street to avoid them."),Bt("Walk on",iE)]),
  pg(iE,"The ending",[H("Closing time",1),If(Pp("The vendor remembers: no bananas for Mira, ever."),"hates","banana"),If(Pp("The vendor remembers: no apples for Mira, ever."),"hates","apple"),Bt("Start again",cur.id,"outline","*")]));draw()});
 return[H("A day at the market",1),Pp("Mira walks into the market. She hates exactly one fruit. Which one?","Mira walks into the market. She hates exactly <b>one fruit</b>. <mark>Which one?</mark>"),ch]}
function tpl(kind){if(kind==="branch"||kind==="showcase")return tplAdv(kind);
 if(kind==="story"){const h=mkBlock("heading");h.lvl=1;h.text="The Journey Begins";const p=mkBlock("paragraph");p.text="Once upon a time...";const q=mkBlock("quote");q.text="Every journey begins somewhere.";return[h,p,q]}
 if(kind==="blog"){const h=mkBlock("heading");h.lvl=1;h.text="Post title";const p=mkBlock("paragraph");p.text="Write your post here.";return[h,p,mkBlock("divider")]}
 return[]}
function newProject(){const id=uid("p_");return{name:"My Story Website",theme:"dark",home:id,assets:{},pages:[{id,title:"Home",slug:"index",nav:true,blocks:tpl("story")}]}}
const snap=()=>JSON.stringify({name:P.name,theme:P.theme,home:P.home,pages:P.pages});
function push(){hist.push(snap());if(hist.length>80)hist.shift();fut=[];dirty()}
function restore(s){Object.assign(P,JSON.parse(s));cur=P.pages.find(p=>p.id===cur?.id)||P.pages[0];sel=null;draw()}
const page=()=>P.pages.find(p=>p.id===cur.id);
let tm;function dirty(){clearTimeout(tm);tm=setTimeout(save,900)}

/* ---------- storage (IndexedDB) ---------- */
const db=()=>new Promise((res,rej)=>{const r=indexedDB.open("gk-story-builder",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function save(){try{const d=await db();d.transaction("k","readwrite").objectStore("k").put(P,"project");flash("Saved")}catch(e){flash("Save failed")}}
async function load(){try{const d=await db();return await new Promise(r=>{const q=d.transaction("k").objectStore("k").get("project");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
function flash(t){const m=$("#msg");m.textContent=t;setTimeout(()=>m.textContent="",1500)}

/* ---------- renderer (shared by editor preview + export) ---------- */
const lnk=h=>h&&h.startsWith("@")?`href="#" data-id="${esc(h.slice(1))}"`:`href="${esc(h||"#")}"`;
const imgTag=(b,u)=>{const im=`<img src="${esc(u)}" alt="${esc(b.alt)}" style="width:${b.size}%"${b.zoom&&!(b.href&&b.href!=="#")?` data-zoom class="zm"`:""}>`;return b.href&&b.href!=="#"?`<a ${lnk(b.href)}>${im}</a>`:im};
const rtxt=b=>b.html?b.html.replace(/href="@([^"]+)"/g,(m,id)=>`href="#" data-id="${esc(id)}"`):esc(b.text).replace(/\n/g,"<br>");
const rh=(h,rl)=>h?h.replace(/href="@([^"]+)"/g,(m,id)=>`href="${rl("@"+id)}"`):h;
function blockHTML(b,img){const h=blockHTML0(b,img);return b.ifk&&h?`<div data-if="${esc(b.ifk)}" data-eq="${esc(b.ifv||"")}" data-op="${b.ifop==="not"?"not":"is"}" hidden>${h}</div>`:h}
function blockHTML0(b,img){
 const a=`style="text-align:${b.align}"`;
 switch(b.t){
 case"heading":return`<h${b.lvl} ${a}>${esc(b.text)}</h${b.lvl}>`;
 case"paragraph":return`<p ${a}>${rtxt(b)}</p>`;
 case"quote":return`<blockquote ${a}>${rtxt(b)}</blockquote>`;
 case"list":case"olist":{const t=b.t==="list"?"ul":"ol";return`<${t} ${a}>${b.items.map(i=>`<li>${esc(i)}</li>`).join("")}</${t}>`}
 case"divider":return"<hr>";
 case"button":return`<p ${a}><a class="btn${b.bstyle==="outline"?" out":""}" ${lnk(b.href)}${b.setk?` data-set="${esc(b.setk)}=${esc(b.setv)}"`:""}>${esc(b.text)}</a></p>`;
 case"gallery":{const im=(b.imgs||[]).map(g=>({u:img(g.asset),g})).filter(x=>x.u);return im.length?`<div class="gal${b.dir==="v"?" gv":""}"${b.auto?` data-auto="${Math.max(1,+b.delay||3)*1000}"`:""}${b.zoom?" data-zoom":""}><div class="gtrack">${im.map(x=>`<figure><img src="${esc(x.u)}" alt="${esc(x.g.alt)}" draggable="false">${x.g.cap?`<figcaption>${esc(x.g.cap)}</figcaption>`:""}</figure>`).join("")}</div><button class="gp" aria-label="Previous image">‹</button><button class="gn" aria-label="Next image">›</button><div class="gdots"></div></div>`:""}
 case"code":return`<pre ${a}><code>${esc(b.text)}</code></pre>`;
 case"table":{const t=b.tbl||[];return`<div class="tw"><table>${t.map((r,i)=>`<tr>${r.map(c=>i===0&&b.hdr!==false?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`}
 case"video":{const u=b.asset&&img(b.asset);return u?`<figure><video controls preload="metadata" src="${esc(u)}" style="width:${b.size}%;max-width:100%"></video>${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:""}</figure>`:""}
 case"audio":{const u=b.asset&&img(b.asset);return u?`<figure><audio controls preload="metadata" src="${esc(u)}" style="width:100%"></audio>${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:""}</figure>`:""}
 case"imgbtn":{const u=b.asset&&img(b.asset);return`<div class="ib ${b.layout||"top"}">${u?`<div class="ibi"><img src="${esc(u)}" alt="${esc(b.alt)}"${b.zoom?' data-zoom class="zm"':""}></div>`:""}<div class="ibt">${b.cap?`<p>${esc(b.cap)}</p>`:""}<p><a class="btn${b.bstyle==="outline"?" out":""}" ${lnk(b.href)}>${esc(b.text)}</a></p></div></div>`}
 case"split":{const m=b.dir==="v"?"sv":b.dir==="g"?"sg":"sh";return`<div class="split ${m}">${(b.cells||[]).map(c=>{if(c.k==="image"){const u=c.asset&&img(c.asset);return u?`<div class="sc"><img src="${esc(u)}" alt="${esc(c.alt)}"${b.zoom?' data-zoom class="zm"':""}></div>`:""}if(c.k==="button")return`<div class="sc"><p><a class="btn${c.bstyle==="outline"?" out":""}" ${lnk(c.href)}>${esc(c.text)}</a></p></div>`;return`<div class="sc">${esc(c.text).split("\n").map(t=>`<p>${t}</p>`).join("")}</div>`}).join("")}</div>`}
 case"choice":return`<section class="choice">${b.text?`<p class="cq">${esc(b.text)}</p>`:""}<div class="opts">${(b.opts||[]).map(o=>`<a class="btn" ${lnk(o.href||(o.to?"@"+o.to:"#"))}${o.setk?` data-set="${esc(o.setk)}=${esc(o.setv)}"`:""}>${esc(o.label)}</a>`).join("")}</div></section>`;
 case"image":{const u=b.asset&&img(b.asset);return u?`<figure ${a}>${imgTag(b,u)}${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:""}</figure>`:""}}
 return""}
const themes={dark:"--bg:#16181d;--tx:#e6e6e6;--mu:#9aa0a6;--ac:#4fc1ff;--card:#1f2229",light:"--bg:#fafaf7;--tx:#1d1d1f;--mu:#6b6b6b;--ac:#0b6bcb;--card:#fff",sepia:"--bg:#f1e7d3;--tx:#3b2f22;--mu:#7a6a55;--ac:#8a4b1f;--card:#f8f0e0"};
const siteCSS=()=>`:root{${themes[P.theme]}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.7 Georgia,"Times New Roman",serif}
header{border-bottom:1px solid #8884;padding:14px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}header b{font-size:1.1em;margin-right:auto}
nav a{color:var(--mu);text-decoration:none;margin-left:16px;font:15px system-ui,sans-serif}nav a:hover,nav a.cur{color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:36px 20px}h1,h2,h3,h4{line-height:1.2;margin:1.4em 0 .5em}h1{font-size:2.4em}main>*:first-child{margin-top:0}
p,ul,ol,figure{margin:0 0 1.1em}figure{margin-left:0;margin-right:0}img{max-width:100%;height:auto;border-radius:6px}figcaption{color:var(--mu);font-size:.85em}
blockquote{margin:1.4em 0;padding-left:18px;border-left:3px solid var(--ac);font-style:italic;font-size:1.15em}hr{border:0;border-top:1px solid #8885;margin:2em 0}
.btn{display:inline-block;background:var(--ac);color:var(--bg);padding:9px 20px;border-radius:5px;text-decoration:none;font:600 15px system-ui,sans-serif}
footer{text-align:center;color:var(--mu);padding:30px;font:14px system-ui,sans-serif}
.btn.out{background:transparent;color:var(--ac);border:2px solid var(--ac);padding:7px 18px}.choice{margin:1.6em 0;padding:20px;border:1px solid #8885;border-radius:8px;background:var(--card)}.choice .cq{margin:0 0 .8em;font-weight:600}.opts{display:flex;flex-wrap:wrap;gap:10px}
.gal{position:relative;margin:0 0 1.4em}.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:6px;cursor:grab}.gtrack::-webkit-scrollbar{display:none}.gtrack figure{flex:0 0 100%;scroll-snap-align:center;margin:0}.gtrack img{display:block;width:100%;border-radius:0;user-select:none;-webkit-user-drag:none}.gtrack figcaption{padding:8px 4px;text-align:center}

function validate(){
 const w=[],slugs={};
 P.pages.forEach(p=>{if(!p.slug)w.push(`Page "${p.title}" has an empty slug.`);if(p.id!==P.home){if(slugs[p.slug])w.push(`Duplicate slug "${p.slug}".`);slugs[p.slug]=1}
  p.blocks.forEach(b=>{if(b.t==="image"&&(!b.asset||!P.assets[b.asset]))w.push(`Page "${p.title}" has an image block with no image.`);
   if(b.t==="button"&&b.href?.startsWith("@")&&!P.pages.some(x=>"@"+x.id===b.href))w.push(`Page "${p.title}" has a button linking to a deleted page.`)})});
 if(!P.pages.some(p=>p.id===P.home))w.push("No home page is set.");
 P.pages.forEach(p=>p.blocks.forEach(b=>{const dead=h=>h?.startsWith("@")&&!P.pages.some(x=>"@"+x.id===h);
  if(b.t==="image"&&dead(b.href))w.push(`Page "${p.title}" has an image linking to a deleted page.`);
  if(b.t==="gallery"&&!(b.imgs||[]).length)w.push(`Page "${p.title}" has an empty gallery.`);
  if(b.t==="choice")(b.opts||[]).forEach(o=>{if(!o.to||!P.pages.some(x=>x.id===o.to))w.push(`Page "${p.title}": choice "${o.label}" has no target page.`)})}));
 P.pages.forEach(p=>p.blocks.forEach(b=>{
  if((b.t==="video"||b.t==="audio")&&(!b.asset||!P.assets[b.asset]))w.push(`Page "${p.title}" has a ${b.t} block with no file.`);if(b.t==="imgbtn"){if(!b.asset||!P.assets[b.asset])w.push(`Page "${p.title}" has an Image + Button with no image.`);if(b.href?.startsWith("@")&&!P.pages.some(x=>"@"+x.id===b.href))w.push(`Page "${p.title}" has an Image + Button linking to a deleted page.`)}
  (b.cells||[]).forEach(c=>{if(c.k==="button"&&c.href?.startsWith("@")&&!P.pages.some(x=>"@"+x.id===c.href))w.push(`Page "${p.title}" has a split-panel button linking to a deleted page.`);if(c.k==="image"&&(!c.asset||!P.assets[c.asset]))w.push(`Page "${p.title}" has a split panel with no image.`)})}));
 return w}

function cleanHTML(h){const d=document.createElement("div");d.innerHTML=h;

  if(t==="mark"||/background/.test(st))r=`<mark>${r}</mark>`;
  if(t==="u"||/underline/.test(st))r=`<u>${r}</u>`;
  if(t==="i"||t==="em"||/font-style:\s*italic/.test(st))r=`<i>${r}</i>`;
  if(t==="b"||t==="strong"||/font-weight:\s*(bold|[6-9]00)/.test(st))r=`<b>${r}</b>`;

  o+=r}});return o};return walk(d)}

/* ----- reusable blocks ----- */
const cloneBl=bl=>JSON.parse(JSON.stringify(bl)).map(b=>({...b,id:uid("b_")}));
function drawLib(){P.lib=P.lib||[];$("#lib").innerHTML=P.lib.length?P.lib.map(l=>`<div class="lb"><span>${esc(l.name)} <small>(${l.blocks.length})</small></span><button data-a="libins" data-l="${l.id}">Insert</button><button data-a="libdel" data-l="${l.id}" aria-label="Remove">✕</button></div>`).join(""):`<p class="hint">Nothing saved yet.</p>`}
$("#libsel").onclick=()=>{const b=page().blocks.find(x=>x.id===sel);if(!b){alert("Select a block first.");return}const n=prompt("Name for this reusable block",labels[b.t]);if(!n)return;P.lib.push({id:uid("l_"),name:n,blocks:cloneBl([b])});drawLib();dirty()};
$("#libpg").onclick=()=>{const bl=page().blocks;if(!bl.length)return;const n=prompt("Name for this group of blocks",page().title);if(!n)return;P.lib.push({id:uid("l_"),name:n,blocks:cloneBl(bl)});drawLib();dirty()};
document.addEventListener("click",e=>{const t=e.target,a=t.dataset.a;if(a!=="libins"&&a!=="libdel")return;const l=(P.lib||[]).find(x=>x.id===t.dataset.l);if(!l)return;
 if(a==="libdel"){if(confirm(`Remove "${l.name}" from the library?`)){P.lib=P.lib.filter(x=>x!==l);drawLib();dirty()}return}
 push();const bl=page().blocks,i=bl.findIndex(x=>x.id===sel),ins=cloneBl(l.blocks);bl.splice(i<0?bl.length:i+1,0,...ins);sel=ins[0].id;draw()});
/* ----- story map ----- */
function edges(){const E=[];P.pages.forEach(p=>p.blocks.forEach(b=>{
 const ok=id=>P.pages.some(x=>x.id===id),add=(h,l,k)=>{if(h?.startsWith("@")&&ok(h.slice(1)))E.push({a:p.id,b:h.slice(1),label:l||"link",kind:k})};
 if(b.t==="choice")(b.opts||[]).forEach(o=>{if(o.to&&ok(o.to))E.push({a:p.id,b:o.to,label:o.label+(o.setk?` ⚑${o.setk}=${o.setv}`:""),kind:"choice"})});
 if(["button","image","imgbtn"].includes(b.t))add(b.href,b.text||b.alt||"link","link");
 (b.cells||[]).forEach(c=>{if(c.k==="button")add(c.href,c.text,"link")});
 [...(b.html||"").matchAll(/href="@([^"]+)"/g)].forEach(m=>add("@"+m[1],"text link","link"))}));return E}
function drawMap(){
 const E=edges(),lv={[P.home]:0},q=[P.home];
 while(q.length){const x=q.shift();E.filter(e=>e.a===x).forEach(e=>{if(lv[e.b]===undefined){lv[e.b]=lv[x]+1;q.push(e.b)}})}
 let mx=Math.max(0,...Object.values(lv));P.pages.forEach(p=>{if(lv[p.id]===undefined)lv[p.id]=mx+1});mx=Math.max(...Object.values(lv));
 const cols=[...Array(mx+1)].map((_,i)=>P.pages.filter(p=>lv[p.id]===i)),W=176,H=46,GX=96,GY=30,pos={};
 cols.forEach((c,i)=>c.forEach((p,j)=>pos[p.id]={x:20+i*(W+GX),y:20+j*(H+GY)}));
 const w=40+cols.length*(W+GX)-GX,h=40+Math.max(1,...cols.map(c=>c.length))*(H+GY)-GY,out=new Set(E.map(e=>e.a)),inn=new Set(E.map(e=>e.b)),cut=(t,n)=>t.length>n?t.slice(0,n-1)+"…":t;
 const ed=E.map(e=>{if(e.a===e.b)return"";const a=pos[e.a],b=pos[e.b],x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;
  return`<path d="M${x1} ${y1}C${x1+50} ${y1},${x2-50} ${y2},${x2} ${y2}" fill="none" stroke="${e.kind==="choice"?"#4fc1ff":"#858585"}" stroke-width="1.5" marker-end="url(#ar)"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" font-size="10" fill="#d4d4d4" text-anchor="middle">${esc(cut(e.label,24))}</text>`}).join("");
 const nodes=P.pages.map(p=>{const c=pos[p.id],dead=!out.has(p.id),orph=p.id!==P.home&&!inn.has(p.id)&&!p.nav,st=dead?"#f4b400":orph?"#888":"#4fc1ff";
  return`<g class="mn" data-id="${p.id}" style="cursor:pointer"><rect x="${c.x}" y="${c.y}" width="${W}" height="${H}" rx="6" fill="#2d2d30" stroke="${st}" stroke-width="${p.id===P.home?3:1.5}"${orph?' stroke-dasharray="4 3"':""}/><text x="${c.x+W/2}" y="${c.y+20}" font-size="13" fill="#d4d4d4" text-anchor="middle">${p.id===P.home?"⌂ ":""}${esc(cut(p.title,20))}</text><text x="${c.x+W/2}" y="${c.y+36}" font-size="10" fill="${st}" text-anchor="middle">${dead?"dead end":orph?"not linked from anywhere":""}</text></g>`}).join("");
 const broken=[];P.pages.forEach(p=>p.blocks.forEach(b=>{if(b.t==="choice")(b.opts||[]).forEach(o=>{if(!o.to||!P.pages.some(x=>x.id===o.to))broken.push(`${p.title}: “${o.label}”`)})}));
 $("#mapbody").innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Story map"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#858585"/></marker></defs>${ed}${nodes}</svg><p class="hint">Blue outline: page. Amber: dead end (no links out). Dashed grey: not linked from anywhere. Blue arrows are choices, grey arrows are links. ⚑ marks a choice that sets a variable. Click a page to open it.</p>`+(broken.length?`<p style="color:var(--dn)">Choices with no target page: ${broken.map(esc).join(", ")}</p>`:"")}
$("#mapb").onclick=()=>{drawMap();$("#mapdlg").showModal()};$("#mapx").onclick=()=>$("#mapdlg").close();
$("#mapbody").addEventListener("click",e=>{const g=e.target.closest(".mn");if(g){cur=P.pages.find(q=>q.id===g.dataset.id)||cur;sel=null;$("#mapdlg").close();draw()}});
function exportHTML(){
 const w=validate();if(w.length&&!confirm("Warnings:\n\n• "+w.join("\n• ")+"\n\nExport anyway?"))return;
 const img=id=>P.assets[id]?.data||null;
 const rl=h=>{if(h?.startsWith("@")){const t=P.pages.find(x=>"@"+x.id===h);return t?"#/"+t.slug:"#"}return h};
 const secs=P.pages.map(p=>{const bl=p.blocks.map(b=>({...b,href:rl(b.href),opts:(b.opts||[]).map(o=>({...o,href:o.to?rl("@"+o.to):"#"})),cells:(b.cells||[]).map(c=>({...c,href:rl(c.href)})),html:rh(b.html,rl)}));
  return`<section class="pg" id="pg-${esc(p.slug)}" hidden><main>${bl.map(b=>blockHTML(b,img)).join("\n")}</main></section>`}).join("\n");
 const home=P.pages.find(x=>x.id===P.home)||P.pages[0];
 const nav=P.pages.filter(x=>x.nav).map(x=>`<a href="#/${esc(x.slug)}">${esc(x.title)}</a>`).join("");
 const proj=JSON.stringify(P).replace(/</g,"\\u003c");
 const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(P.name)}</title><style>${siteCSS()}section.pg[hidden]{display:none}</style></head><body><header><b>${esc(P.name)}</b><nav>${nav}</nav></header>${secs}<footer>© ${new Date().getFullYear()} ${esc(P.name)}</footer><script type="application/json" id="gk-project">${proj}<\/script><script>const HOME=${JSON.stringify(home.slug)};${routeJS}${galJS}<\/script></body></html>`;
 download((slugify(P.name)||"website")+".html",new Blob([html],{type:"text/html"}));flash("Exported")}
$("#exph").onclick=exportHTML;
/* ---------- boot ---------- */
(async()=>{P=await load()||newProject();P.assets=P.assets||{};cur=P.pages[0];draw()})();
</script></body></html>
